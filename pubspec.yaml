name: aid_pulsate
description: "AidPulsate — offline-resilient emergency SOS platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # Location
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # Connectivity
  connectivity_plus: ^6.1.4

  # Local storage (offline queue)
  shared_preferences: ^2.3.5

  # SMS fallback
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
